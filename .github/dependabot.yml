version: 2
# One grouped PR per ecosystem per month instead of a dozen single bumps. Major versions are
# ignored here: they change APIs (drift, file_picker, TypeScript 7, Vitest 5) and get a
# deliberate commit with the code changes they need.
updates:
  - package-ecosystem: pub
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    groups:
      pub-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    groups:
      web-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
  - package-ecosystem: npm
    directory: /worker
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    groups:
      worker-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions:
        patterns: ['*']
