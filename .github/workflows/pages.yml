name: pages

on:
  push:
    branches: [main]
    paths: ['web/**', 'design/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false      # never cancel an in-flight production deploy

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test -- --run                 # a broken Lite never reaches the live URL
      - name: Build Marquee Lite (served from /marquee/)
        run: npm run build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          # Public config only. The API key lives in the Worker.
          VITE_API_BASE: ${{ vars.WORKER_URL }}
          VITE_APP_VERSION: ${{ github.sha }}
      - name: SPA fallback for deep links
        run: cp dist/index.html dist/404.html
      # A repo with Pages switched off would fail configure-pages with a bare 404. Build and test
      # anyway, then say exactly which switch to flip.
      - name: Is GitHub Pages switched on?
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub Pages is not enabled. Settings → Pages → Build and deployment → Source: GitHub Actions, then re-run this workflow. Marquee Lite was built and tested but not deployed."
          fi
      - uses: actions/configure-pages@v5
        if: steps.pages.outputs.enabled == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.enabled == 'true'
        with:
          path: web/dist                        # relative to the workspace, not working-directory

  deploy:
    needs: build
    if: needs.build.outputs.enabled == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
