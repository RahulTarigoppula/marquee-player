name: android-smoke

# The built APK on an Android emulator (scripts/android-smoke.py): a cold start to the Lobby,
# a film opened through "Open with", the system's media controls, the screen-off pause and
# play in the dark. The only place the Android side RUNS before a phone does; the screenshots
# it uploads are the only pictures of the real app on Android.
#
# Called by release.yml on the APK that run just built. Run it alone from the Actions tab
# against an earlier release run ("Run workflow", the run's number from its URL) to try a
# change to the script, or to look at a build again, in a third of the time.
on:
  workflow_call:
    inputs:
      run_id:
        description: The release run whose APKs to test (default, this run)
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      run_id:
        description: The release run whose APKs to test (the number in its URL)
        required: true

permissions:
  contents: read
  actions: read                  # another run's artifacts

jobs:
  emulator:
    name: android smoke (emulator)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: 'marquee-android-apks-*'
          merge-multiple: true
          run-id: ${{ inputs.run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: A three-minute film (never committed)
        run: |
          set -euo pipefail
          command -v ffmpeg >/dev/null 2>&1 || {
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends ffmpeg
          }
          mkdir -p build/android-smoke
          ffmpeg -hide_banner -loglevel error -nostdin -y \
            -f lavfi -i "testsrc2=size=640x360:rate=24" \
            -f lavfi -i "sine=frequency=440:sample_rate=48000" \
            -t 180 -c:v libx264 -preset ultrafast -pix_fmt yuv420p -g 48 \
            -c:a aac -b:a 96k -movflags +faststart build/android-smoke/marquee-smoke.mp4
          ls -la build/android-smoke dist
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          script: python3 scripts/android-smoke.py dist/marquee-android-x86_64.apk build/android-smoke/marquee-smoke.mp4 build/android-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke-evidence
          path: |
            build/android-smoke/*.txt
            build/android-smoke/*.png
          retention-days: 14
