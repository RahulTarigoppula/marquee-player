name: release

on:
  push:
    tags: ['v*']
  schedule:
    - cron: '0 4 * * 1'          # Mondays 04:00 UTC — integration tests only
  workflow_dispatch:             # manual run: artifacts only, no Release

permissions:
  contents: write                # softprops/action-gh-release needs this

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false      # never cancel a half-published release

env:
  FLUTTER_VERSION: '3.47.5'

jobs:
  # ---------------------------------------------------------------- integration
  test:
    name: integration (real libmpv, windows)
    runs-on: windows-latest      # VS 2022 + C++ workload preinstalled
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '${{ env.FLUTTER_VERSION }}', channel: stable, cache: true }
      - run: flutter --version
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs   # drift: *.g.dart is gitignored
      - run: flutter analyze --fatal-infos
      - name: Unit + widget tests (goldens are Linux-only)
        run: flutter test --exclude-tags golden --reporter github
      - name: Integration tests against the committed fixtures
        if: hashFiles('integration_test/**') != ''
        run: flutter test integration_test -d windows

  # ---------------------------------------------------------------- build matrix
  build:
    name: ${{ matrix.label }}
    needs: test
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25          # N17: tag -> artifacts in under 25 min
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x64
            os: windows-latest
            target: windows
          - label: android-apks
            os: ubuntu-24.04     # Android SDK 34-37, build-tools, JDKs preinstalled
            target: android
    steps:
      - uses: actions/checkout@v5

      - name: Derive version
        id: v
        shell: bash
        run: |
          set -euo pipefail
          RAW='${{ github.ref_type == 'tag' && github.ref_name || format('v0.0.{0}', github.run_number) }}'
          echo "name=${RAW#v}"                  >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}"  >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        if: matrix.target == 'android'
        with:
          distribution: temurin
          java-version: '17'     # R1 — the proven version for this Flutter + AGP pair
          cache: gradle

      - uses: subosito/flutter-action@v2
        with: { flutter-version: '${{ env.FLUTTER_VERSION }}', channel: stable, cache: true }

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs   # drift: *.g.dart is gitignored

      # ------------------------------------------------------------- Windows
      - name: Build Windows release
        if: matrix.target == 'windows'
        run: >
          flutter build windows --release
          --build-name=${{ steps.v.outputs.name }}
          --build-number=${{ steps.v.outputs.code }}
          --dart-define=OS_API_KEY=${{ secrets.OS_API_KEY }}
          --dart-define=TMDB_READ_TOKEN=${{ secrets.TMDB_READ_TOKEN }}
          --dart-define=MARQUEE_VERSION=${{ steps.v.outputs.name }}

      - name: Bundle the MSVC runtime (app-local, so no VC++ redistributable is needed)
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $src = 'build/windows/x64/runner/Release'
          # Flutter does not ship the C++ runtime; a friend's PC without the redistributable
          # would fail with "MSVCP140.dll was not found". App-local deployment is allowed by the
          # Visual C++ redistribution terms.
          $dlls = 'msvcp140.dll','msvcp140_1.dll','msvcp140_2.dll','vcruntime140.dll','vcruntime140_1.dll'
          $redist = Get-Item "${env:ProgramFiles}\Microsoft Visual Studio\*\*\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1
          foreach ($dll in $dlls) {
            if (Test-Path "$src/$dll") { continue }
            $from = if ($redist -and (Test-Path "$($redist.FullName)/$dll")) { "$($redist.FullName)/$dll" } else { "$env:WINDIR/System32/$dll" }
            if (Test-Path $from) { Copy-Item $from "$src/$dll"; Write-Host "bundled $dll from $from" }
          }

      - name: Zip, gate on size, checksum
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $src = 'build/windows/x64/runner/Release'
          # media_kit_libs_windows_video copies the DLL here; a build without it runs nowhere.
          $missing = @()
          foreach ($dll in 'marquee.exe','libmpv-2.dll','flutter_windows.dll','msvcp140.dll','vcruntime140.dll','vcruntime140_1.dll') {
            if (-not (Test-Path "$src/$dll")) { $missing += $dll }
          }
          if ($missing) {
            Get-ChildItem $src | ForEach-Object { Write-Host "  $($_.Name)" }
            Write-Host "::error::missing from the build output: $($missing -join ', ')"
            exit 1
          }
          New-Item -ItemType Directory -Force out | Out-Null
          $zip = "out/marquee-windows-x64-portable.zip"
          Compress-Archive -Path "$src/*" -DestinationPath $zip
          $mb = [math]::Round((Get-Item $zip).Length / 1MB, 1)
          Write-Host "Windows zip: $mb MB"
          if ($mb -gt 60) { Write-Host "::warning::Windows zip is $mb MB; the budget is 60 MB (N9)" }
          if ($mb -gt 150) { Write-Host "::error::Windows zip is $mb MB, far over budget"; exit 1 }

      - name: Build the installer (Inno Setup, per-user, no admin)
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress | Out-Null
          }
          if (-not (Test-Path $iscc)) { Write-Host "::error::Inno Setup is not available"; exit 1 }
          $src = (Resolve-Path 'build/windows/x64/runner/Release').Path
          $out = (Resolve-Path 'out').Path
          & $iscc "/DAppVersion=${{ steps.v.outputs.name }}" "/DSourceDir=$src" "/DOutputDir=$out" 'windows/installer/marquee.iss'
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::ISCC failed ($LASTEXITCODE)"; exit 1 }
          Get-ChildItem out/*.zip, out/*.exe | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Out-File -Encoding ascii out/SHA256SUMS-windows.txt
          Get-Content out/SHA256SUMS-windows.txt

      # ------------------------------------------------------------- Android
      - name: Decode keystore
        if: matrix.target == 'android'
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set — the APKs will be DEBUG-signed and cannot update a release-signed install."
            exit 0
          fi
          printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Build signed split-per-ABI APKs
        if: matrix.target == 'android'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >
          flutter build apk --release --split-per-abi
          --build-name=${{ steps.v.outputs.name }}
          --build-number=${{ steps.v.outputs.code }}
          --dart-define=OS_API_KEY=${{ secrets.OS_API_KEY }}
          --dart-define=TMDB_READ_TOKEN=${{ secrets.TMDB_READ_TOKEN }}
          --dart-define=MARQUEE_VERSION=${{ steps.v.outputs.name }}

      - name: Verify signing, gate on size, rename, checksum
        if: matrix.target == 'android'
        run: |
          set -euo pipefail
          mkdir -p out
          ls -la build/app/outputs/flutter-apk/ || true
          # Pick the newest apksigner that actually runs on this JDK (a pre-release build-tools
          # can need a newer Java than the one the build used).
          APKSIGNER=""
          for cand in $(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -rV); do
            if "$cand/apksigner" --version >/dev/null 2>&1; then APKSIGNER="$cand/apksigner"; break; fi
          done
          [ -n "$APKSIGNER" ] || { echo "::error::no working apksigner in $ANDROID_HOME/build-tools"; exit 1; }
          echo "apksigner: $APKSIGNER ($("$APKSIGNER" --version))"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            src="build/app/outputs/flutter-apk/app-$abi-release.apk"
            test -f "$src" || { echo "::error::$src was not built"; exit 1; }
            certs=$("$APKSIGNER" verify --print-certs "$src" 2>&1) || true
            echo "$certs" | sed "s/^/  [$abi] /"
            if ! grep -q 'certificate DN' <<<"$certs"; then
              echo "::error::$abi APK is not signed: $(tr '\n' ' ' <<<"$certs" | cut -c1-600)"; exit 1
            fi
            # With a release key configured, a debug-signed APK is a mistake: fail loudly.
            if [ -n "${ANDROID_KEYSTORE_FILE:-}" ] && grep -qi 'CN=Android Debug' <<<"$certs"; then
              echo "::error::$abi APK is DEBUG-signed although a release key is configured"; exit 1
            fi
            cp "$src" "out/marquee-android-$abi.apk"
          done
          if [ -z "${ANDROID_KEYSTORE_FILE:-}" ]; then
            echo "SIGNING=debug" >> "$GITHUB_ENV"
          fi
          # No universal APK — libmpv is ~30-40 MB per ABI (N11)
          test ! -f build/app/outputs/flutter-apk/app-release.apk
          sz=$(stat -c%s "out/marquee-android-arm64-v8a.apk")
          echo "arm64-v8a APK: $((sz / 1024 / 1024)) MB"
          if [ "$sz" -gt $((55 * 1024 * 1024)) ]; then
            echo "::warning::arm64 APK is $((sz / 1024 / 1024)) MB; the budget is 55 MB (N10)"
          fi
          (cd out && sha256sum *.apk > SHA256SUMS-android.txt)
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: marquee-${{ matrix.label }}-${{ steps.v.outputs.name }}
          path: out/
          retention-days: 14

  # ---------------------------------------------------------------- publish
  publish:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - run: ls -la dist
      - name: Release notes
        run: |
          cat > notes.md <<'NOTES'
          ## Install

          | You have | Download |
          |---|---|
          | **Windows 10/11** | `marquee-windows-x64-setup.exe` — installs for your user only (no admin), adds Start-menu entry and "Open with → Marquee" for video files |
          | Windows, no install | `marquee-windows-x64-portable.zip` — extract anywhere, run `marquee.exe` |
          | **Android 8+ phone** | `marquee-android-arm64-v8a.apk` (every phone since ~2019) · `armeabi-v7a` for very old phones · `x86_64` for emulators |

          **Windows:** the installer is not code-signed (certificates cost money), so SmartScreen says
          "Windows protected your PC" → **More info → Run anyway**.

          **Android:** open the APK on the phone and allow "install unknown apps" once.

          **Subtitles:** sign in with a free OpenSubtitles.com account in the Ticket Office (gear icon).
          If this build has no API key baked in, paste a free consumer key there too (OpenSubtitles →
          Profile → API Consumers).

          Subtitles by OpenSubtitles.com. Playback by libmpv / FFmpeg / libass (LGPL — see
          the Ticket Office for notices and source links). Verify downloads against `SHA256SUMS-*.txt`.
          No telemetry, no accounts of our own: only the file's hash, size and a title query ever leave the device.
          NOTES
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -rV | while read -r d; do "$d/apksigner" --version >/dev/null 2>&1 && { echo "$d/apksigner"; break; }; done)
          if [ -n "$APKSIGNER" ] && "$APKSIGNER" verify --print-certs dist/marquee-android-arm64-v8a.apk 2>&1 | grep -qi "CN=Android Debug"; then
            cat >> notes.md <<'NOTES'

          > **Android update note:** this build is signed with a throwaway CI key (the repo has no
          > release keystore secret yet), so it will not install over an earlier Marquee APK —
          > uninstall the old one first. Once the owner adds `ANDROID_KEYSTORE_*` secrets, every
          > later release updates in place.
          NOTES
          fi
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body_path: notes.md
          files: |
            dist/*.exe
            dist/*.zip
            dist/*.apk
            dist/SHA256SUMS-*.txt
