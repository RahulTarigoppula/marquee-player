name: release

# What each trigger does:
#   tag v*             gate -> build (Windows + Android) -> publish a GitHub Release
#   workflow_dispatch  gate -> build; the files are run artifacts (14 days), nothing is published.
#                      Use it on main to try a build before tagging.
#   schedule           the real-playback test alone (catches a runner image or libmpv drift)
# The real-playback job never holds a release back: it is new, and a flaky test must not cost a tag.
on:
  push:
    tags: ['v*']
  schedule:
    - cron: '0 4 * * 1'          # Mondays 04:00 UTC: the playback test only (no analyze, no builds)
  workflow_dispatch:             # manual run: artifacts only, no Release

permissions:
  contents: write                # softprops/action-gh-release needs this

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false      # never cancel a half-published release

env:
  FLUTTER_VERSION: '3.47.5'

jobs:
  # ---------------------------------------------------------------- gate
  # What a release waits for. Not on the schedule: ci.yml already runs these on every push.
  gate:
    name: analyze + unit tests (windows)
    if: github.event_name != 'schedule'
    runs-on: windows-latest      # Visual Studio + C++ workload preinstalled
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '${{ env.FLUTTER_VERSION }}', channel: stable, cache: true }
      - run: flutter --version
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs   # drift: *.g.dart is gitignored
      - run: flutter analyze --fatal-infos
      - name: Unit + widget tests (goldens are Linux-only)
        run: flutter test --exclude-tags golden,screenshot --reporter github

  # ---------------------------------------------------------------- real playback
  # Its own job, beside the gate and never in `needs`: advisory for a tag or a manual run,
  # blocking on the schedule (where it is the only job, and a red run is how we hear of it).
  playback:
    name: real playback
    uses: ./.github/workflows/playback.yml
    with:
      blocking: ${{ github.event_name == 'schedule' }}

  # ---------------------------------------------------------------- build matrix
  build:
    name: ${{ matrix.label }}
    needs: gate
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25          # N17: tag -> artifacts in under 25 min
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x64
            os: windows-latest
            target: windows
          - label: android-apks
            os: ubuntu-24.04     # Android SDK 34-37, build-tools, JDKs preinstalled
            target: android
    steps:
      - uses: actions/checkout@v5

      - name: Derive version
        id: v
        shell: bash
        run: |
          set -euo pipefail
          RAW='${{ github.ref_type == 'tag' && github.ref_name || format('v0.0.{0}', github.run_number) }}'
          echo "name=${RAW#v}"                  >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}"  >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        if: matrix.target == 'android'
        with:
          distribution: temurin
          java-version: '17'     # R1: the proven version for this Flutter + AGP pair
          cache: gradle

      - uses: subosito/flutter-action@v2
        with: { flutter-version: '${{ env.FLUTTER_VERSION }}', channel: stable, cache: true }

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs   # drift: *.g.dart is gitignored

      # ------------------------------------------------------------- Windows
      - name: Build Windows release
        if: matrix.target == 'windows'
        run: >
          flutter build windows --release
          --build-name=${{ steps.v.outputs.name }}
          --build-number=${{ steps.v.outputs.code }}
          --dart-define=OS_API_KEY=${{ secrets.OS_API_KEY }}
          --dart-define=TMDB_READ_TOKEN=${{ secrets.TMDB_READ_TOKEN }}
          --dart-define=MARQUEE_VERSION=${{ steps.v.outputs.name }}

      - name: Bundle the MSVC runtime (app-local, so no VC++ redistributable is needed)
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $src = 'build/windows/x64/runner/Release'
          # Flutter does not ship the C++ runtime; a friend's PC without the redistributable
          # would fail with "MSVCP140.dll was not found". App-local deployment is allowed by the
          # Visual C++ redistribution terms.
          $dlls = 'msvcp140.dll','msvcp140_1.dll','msvcp140_2.dll','vcruntime140.dll','vcruntime140_1.dll'
          $redist = Get-Item "${env:ProgramFiles}\Microsoft Visual Studio\*\*\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1
          # The whole CRT folder, which is the supported way to deploy app-local: a plugin built
          # with a newer toolset may want msvcp140_atomic_wait.dll or vcruntime140_threads.dll,
          # and a hand-picked list would only fail on a friend's PC.
          if ($redist) {
            foreach ($f in Get-ChildItem $redist.FullName -Filter '*.dll') {
              if (-not (Test-Path "$src/$($f.Name)")) { Copy-Item $f.FullName "$src/$($f.Name)"; Write-Host "bundled $($f.Name) from $($redist.FullName)" }
            }
          } else {
            Write-Host "::warning::No Visual C++ redistributable folder under Visual Studio; falling back to System32 for the runtime DLLs"
          }
          foreach ($dll in $dlls) {
            if (Test-Path "$src/$dll") { continue }
            $from = "$env:WINDIR/System32/$dll"
            if (Test-Path $from) { Copy-Item $from "$src/$dll"; Write-Host "bundled $dll from $from" }
          }

      - name: Zip, gate on size, checksum
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $src = 'build/windows/x64/runner/Release'
          # media_kit_libs_windows_video copies the DLL here; a build without it runs nowhere.
          $missing = @()
          foreach ($dll in 'marquee.exe','libmpv-2.dll','flutter_windows.dll','msvcp140.dll','vcruntime140.dll','vcruntime140_1.dll') {
            if (-not (Test-Path "$src/$dll")) { $missing += $dll }
          }
          if ($missing) {
            Get-ChildItem $src | ForEach-Object { Write-Host "  $($_.Name)" }
            Write-Host "::error::missing from the build output: $($missing -join ', ')"
            exit 1
          }
          New-Item -ItemType Directory -Force out | Out-Null
          $zip = "out/marquee-windows-x64-portable.zip"
          Compress-Archive -Path "$src/*" -DestinationPath $zip
          $mb = [math]::Round((Get-Item $zip).Length / 1MB, 1)
          Write-Host "Windows zip: $mb MB"
          if ($mb -gt 60) { Write-Host "::warning::Windows zip is $mb MB; the budget is 60 MB (N9)" }
          if ($mb -gt 150) { Write-Host "::error::Windows zip is $mb MB, far over budget"; exit 1 }

      - name: Build the installer (Inno Setup, per-user, no admin)
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress | Out-Null
          }
          if (-not (Test-Path $iscc)) { Write-Host "::error::Inno Setup is not available"; exit 1 }
          $src = (Resolve-Path 'build/windows/x64/runner/Release').Path
          $out = (Resolve-Path 'out').Path
          & $iscc "/DAppVersion=${{ steps.v.outputs.name }}" "/DSourceDir=$src" "/DOutputDir=$out" 'windows/installer/marquee.iss'
          if ($LASTEXITCODE -ne 0) { Write-Host "::error title=Installer::ISCC could not compile windows/installer/marquee.iss (exit $LASTEXITCODE): the line it names is in the log above"; exit 1 }
          if (-not (Test-Path out/marquee-windows-x64-setup.exe)) { Write-Host "::error title=Installer::ISCC succeeded but out/marquee-windows-x64-setup.exe is missing"; exit 1 }

      # Advisory: a red result is reported, the files are still built and published.
      - name: Installer smoke test (install, launch, upgrade over the running app, uninstall)
        if: matrix.target == 'windows'
        id: smoke
        continue-on-error: true
        timeout-minutes: 6       # a hung Setup must cost this step, never the build
        shell: pwsh
        run: ./scripts/installer-smoke.ps1 -Installer out/marquee-windows-x64-setup.exe -LogDir "$env:RUNNER_TEMP/installer-smoke"

      - name: Name the installer for people, checksum
        if: matrix.target == 'windows'
        shell: pwsh
        env:
          SMOKE: ${{ steps.smoke.outcome }}
        run: |
          if ($env:SMOKE -ne 'success') {
            Write-Host "::warning title=Installer smoke test failed (advisory)::The installer was built and will be published, but installing, upgrading or uninstalling it misbehaved on the runner. See the 'Installer smoke test' step and the installer-smoke-log artifact."
          }
          # The same file under the name a friend looks for. The old name stays: README links use it.
          Copy-Item out/marquee-windows-x64-setup.exe out/Marquee-Windows-Setup.exe
          $sums = Get-ChildItem out/*.zip, out/*.exe | Sort-Object Name | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" }
          # LF line ends: to `sha256sum -c` a CRLF file names files that end in a carriage return.
          $sumsFile = Join-Path (Resolve-Path out).Path 'SHA256SUMS-windows.txt'
          [IO.File]::WriteAllText($sumsFile, (($sums -join "`n") + "`n"))
          Get-Content $sumsFile
          $rows = Get-ChildItem out | Sort-Object Name | ForEach-Object { "| ``$($_.Name)`` | $([math]::Round($_.Length / 1MB, 1)) MB |" }
          @("### Windows files (${{ steps.v.outputs.name }})", '', '| File | Size |', '|---|---|') + $rows |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - uses: actions/upload-artifact@v4
        if: matrix.target == 'windows' && steps.smoke.outcome == 'failure'
        with:
          name: installer-smoke-log
          path: ${{ runner.temp }}/installer-smoke/
          retention-days: 14
          if-no-files-found: ignore

      # ------------------------------------------------------------- Android
      - name: Decode keystore
        if: matrix.target == 'android'
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set, the APKs will be DEBUG-signed and cannot update a release-signed install."
            exit 0
          fi
          printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Build signed split-per-ABI APKs
        if: matrix.target == 'android'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >
          flutter build apk --release --split-per-abi
          --build-name=${{ steps.v.outputs.name }}
          --build-number=${{ steps.v.outputs.code }}
          --dart-define=OS_API_KEY=${{ secrets.OS_API_KEY }}
          --dart-define=TMDB_READ_TOKEN=${{ secrets.TMDB_READ_TOKEN }}
          --dart-define=MARQUEE_VERSION=${{ steps.v.outputs.name }}

      - name: Verify signing, gate on size, rename, checksum
        if: matrix.target == 'android'
        run: |
          set -euo pipefail
          mkdir -p out
          ls -la build/app/outputs/flutter-apk/ || true
          # Pick the newest apksigner that actually runs on this JDK (a pre-release build-tools
          # can need a newer Java than the one the build used).
          APKSIGNER=""
          for cand in $(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -rV); do
            if "$cand/apksigner" --version >/dev/null 2>&1; then APKSIGNER="$cand/apksigner"; break; fi
          done
          [ -n "$APKSIGNER" ] || { echo "::error::no working apksigner in $ANDROID_HOME/build-tools"; exit 1; }
          echo "apksigner: $APKSIGNER ($("$APKSIGNER" --version))"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            src="build/app/outputs/flutter-apk/app-$abi-release.apk"
            test -f "$src" || { echo "::error::$src was not built"; exit 1; }
            certs=$("$APKSIGNER" verify --print-certs "$src" 2>&1) || true
            echo "$certs" | sed "s/^/  [$abi] /"
            if ! grep -q 'certificate DN' <<<"$certs"; then
              echo "::error::$abi APK is not signed: $(tr '\n' ' ' <<<"$certs" | cut -c1-600)"; exit 1
            fi
            # With a release key configured, a debug-signed APK is a mistake: fail loudly.
            if [ -n "${ANDROID_KEYSTORE_FILE:-}" ] && grep -qi 'CN=Android Debug' <<<"$certs"; then
              echo "::error::$abi APK is DEBUG-signed although a release key is configured"; exit 1
            fi
            cp "$src" "out/marquee-android-$abi.apk"
          done
          # The same file under the name a friend looks for ("arm64-v8a" means nothing to them).
          cp out/marquee-android-arm64-v8a.apk out/Marquee-Android.apk
          if [ -z "${ANDROID_KEYSTORE_FILE:-}" ]; then
            SIGNED="DEBUG key (no ANDROID_KEYSTORE_* secrets): it cannot be installed over a release-signed Marquee"
          else
            SIGNED="release key ($(grep -m1 'certificate DN' <<<"$certs" | sed 's/^.*certificate DN: //'))"
          fi
          # No universal APK: libmpv is ~30-40 MB per ABI (N11)
          test ! -f build/app/outputs/flutter-apk/app-release.apk
          sz=$(stat -c%s "out/marquee-android-arm64-v8a.apk")
          echo "arm64-v8a APK: $((sz / 1024 / 1024)) MB"
          if [ "$sz" -gt $((55 * 1024 * 1024)) ]; then
            echo "::warning::arm64 APK is $((sz / 1024 / 1024)) MB; the budget is 55 MB (N10)"
          fi
          (cd out && sha256sum *.apk > SHA256SUMS-android.txt)
          ls -la out
          {
            echo "### Android files (${{ steps.v.outputs.name }}, versionCode base ${{ steps.v.outputs.code }})"
            echo
            echo "Signed with the $SIGNED."
            echo
            echo "| File | Size |"
            echo "|---|---|"
            for f in out/*.apk; do echo "| \`$(basename "$f")\` | $(( $(stat -c%s "$f") / 1024 / 1024 )) MB |"; done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: marquee-${{ matrix.label }}-${{ steps.v.outputs.name }}
          path: out/
          retention-days: 14

  # ---------------------------------------------------------------- android, running
  # The built APK on an emulator: the film opens through "Open with", reaches the system's media
  # controls, pauses when the screen goes off and plays on from a media key in the dark
  # (scripts/android-smoke.py). The only place the Kotlin side RUNS before a phone does.
  # Like the playback job it never holds a release back: emulators on shared runners are slow
  # and sometimes do not boot. Read it before tagging.
  android-smoke:
    name: android smoke (emulator)
    needs: build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with: { path: dist, pattern: 'marquee-android-apks-*', merge-multiple: true }
      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: A three-minute film (never committed)
        run: |
          set -euo pipefail
          command -v ffmpeg >/dev/null 2>&1 || {
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends ffmpeg
          }
          mkdir -p build/android-smoke
          ffmpeg -hide_banner -loglevel error -nostdin -y \
            -f lavfi -i "testsrc2=size=640x360:rate=24" \
            -f lavfi -i "sine=frequency=440:sample_rate=48000" \
            -t 180 -c:v libx264 -preset ultrafast -pix_fmt yuv420p -g 48 \
            -c:a aac -b:a 96k -movflags +faststart build/android-smoke/marquee-smoke.mp4
          ls -la build/android-smoke dist
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          script: python3 scripts/android-smoke.py dist/marquee-android-x86_64.apk build/android-smoke/marquee-smoke.mp4 build/android-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke-evidence
          path: |
            build/android-smoke/*.txt
            build/android-smoke/*.png
          retention-days: 14

  # ---------------------------------------------------------------- publish
  publish:
    needs: build
    # A pushed tag only: a manual run started ON a tag builds artifacts like any other manual run.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        # Only the build outputs: the playback evidence and installer logs are not release files.
        with: { path: dist, pattern: 'marquee-*', merge-multiple: true }
      - name: Every file a friend is told to download is here
        run: |
          set -euo pipefail
          ls -la dist
          missing=0
          for f in Marquee-Windows-Setup.exe Marquee-Android.apk \
                   marquee-windows-x64-setup.exe marquee-windows-x64-portable.zip \
                   marquee-android-arm64-v8a.apk marquee-android-armeabi-v7a.apk marquee-android-x86_64.apk \
                   SHA256SUMS-windows.txt SHA256SUMS-android.txt; do
            if [ ! -s "dist/$f" ]; then echo "::error title=Release file missing::$f is not among the build artifacts"; missing=1; fi
          done
          [ "$missing" = 0 ]
          # What was built is what gets published (the artifacts crossed two jobs to get here).
          (cd dist && cat SHA256SUMS-android.txt SHA256SUMS-windows.txt | tr -d '\r' | sha256sum -c -)
      - name: Release notes
        env:
          HAS_OS_KEY: ${{ secrets.OS_API_KEY != '' }}
        run: |
          cat > notes.md <<'NOTES'
          ## Install

          | You have | Download |
          |---|---|
          | **Windows 10 or 11** | **`Marquee-Windows-Setup.exe`**: installs for you only (no admin needed), adds a Start menu entry and "Open with Marquee" for video files |
          | **Android 8 or newer** | **`Marquee-Android.apk`**: open it on the phone and allow "install unknown apps" once |

          The other files are for the few who need them:

          | File | What it is |
          |---|---|
          | `marquee-windows-x64-portable.zip` | Windows without installing: extract anywhere, run `marquee.exe` |
          | `marquee-windows-x64-setup.exe` | the same installer as `Marquee-Windows-Setup.exe`, under its old name |
          | `marquee-android-arm64-v8a.apk` | the same file as `Marquee-Android.apk`, under its old name |
          | `marquee-android-armeabi-v7a.apk` | for an old 32-bit phone that refuses `Marquee-Android.apk` |
          | `marquee-android-x86_64.apk` | for emulators and Intel Chromebooks |

          **Windows:** the installer is not code-signed (certificates cost money), so SmartScreen says
          "Windows protected your PC". Choose **More info**, then **Run anyway**. Installing over an
          older Marquee keeps your library, settings and resume points.

          NOTES
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -rV | while read -r d; do "$d/apksigner" --version >/dev/null 2>&1 && { echo "$d/apksigner"; break; }; done)
          if [ -n "$APKSIGNER" ] && "$APKSIGNER" verify --print-certs dist/Marquee-Android.apk 2>&1 | grep -qi "CN=Android Debug"; then
            cat >> notes.md <<'NOTES'
          **Android:** this build is signed with a throwaway key (the repository has no release
          keystore), so it will not install over an earlier Marquee. Uninstall the old one first;
          that also clears its library.

          NOTES
          else
            cat >> notes.md <<'NOTES'
          **Android:** it installs over an earlier Marquee and keeps your library, settings and
          resume points.

          NOTES
          fi
          if [ "$HAS_OS_KEY" = "true" ]; then
            cat >> notes.md <<'NOTES'
          **Subtitles:** a subtitle file beside the film and subtitles inside the film work at once.
          To search online, sign in with a free OpenSubtitles.com account in Settings (the gear icon).

          NOTES
          else
            cat >> notes.md <<'NOTES'
          **Subtitles:** a subtitle file beside the film and subtitles inside the film work at once.
          Searching online needs a free OpenSubtitles.com account and a free API key of your own
          (OpenSubtitles.com, Profile, API Consumers): add both in Settings (the gear icon).

          NOTES
          fi
          cat >> notes.md <<'NOTES'
          Subtitles by OpenSubtitles.com. Playback by libmpv / FFmpeg / libass (LGPL, see
          Settings for notices and source links). Verify downloads against `SHA256SUMS-*.txt`.
          No telemetry, no accounts of our own: only the file's hash, size and a title query ever
          leave the device.
          NOTES
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body_path: notes.md
          files: |
            dist/*.exe
            dist/*.zip
            dist/*.apk
            dist/SHA256SUMS-*.txt
