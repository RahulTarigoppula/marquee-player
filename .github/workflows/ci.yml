name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.5'      # pinned (matches .fvmrc); moved only in a deliberate commit

jobs:
  dart:
    name: analyze + dart tests + goldens
    runs-on: ubuntu-24.04        # goldens are generated on Linux ONLY
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '${{ env.FLUTTER_VERSION }}', channel: stable, cache: true }
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs   # drift: *.g.dart is gitignored
      # Tracked sources only: build_runner's *.g.dart output is not ours to format.
      - name: dart format (tracked files)
        run: git ls-files -z '*.dart' | xargs -0 dart format --output=none --set-exit-if-changed
      - run: flutter analyze --fatal-infos
      - run: flutter test --coverage --reporter github --exclude-tags screenshot
      - name: Coverage gates
        run: dart run tool/check_coverage.dart coverage/lcov.info
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: golden-failures, path: test/**/failures/, retention-days: 7, if-no-files-found: ignore }

  web:
    name: vitest + size-limit
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npx biome ci .
      - run: npm test -- --run --coverage
      - run: npm run build
        env:
          VITE_BASE_PATH: /marquee-player/
          VITE_API_BASE: ${{ vars.WORKER_URL }}
      - run: npx size-limit          # N12 / N13

  worker:
    name: worker tests
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: worker } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: worker/package-lock.json }
      - run: npm ci
      - run: npx biome ci .          # includes the noConsole rule scoped to worker/
      - run: npx tsc --noEmit
      - run: npm test                # every §7.6 invariant

  e2e:
    name: playwright
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: playwright-report, path: web/playwright-report/, retention-days: 7, if-no-files-found: ignore }

  checks:
    name: tokens, parity, cue sheet, licences, secrets
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '${{ env.FLUTTER_VERSION }}', channel: stable, cache: true }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # Media fixtures (scripts/make-fixtures.sh) join this job once the ffmpeg-built corpus exists.
      - run: flutter pub get                       # dart format needs the package config
      - name: Design tokens in sync (G9)
        run: node scripts/tokens.mjs && git diff --exit-code web/src/styles/tokens.css lib/theme/tokens.dart
      - name: Engine test parity between Dart and TS
        run: node scripts/check-parity.mjs --strict
      - name: Cue sheet in sync (G10)
        run: node scripts/check-cue-sheet.mjs
      - name: No secrets, no telemetry (G5/G6)
        run: bash tool/check_no_secrets.sh
      - name: Licence allow-list (G1)
        run: |
          dart run build_runner build --delete-conflicting-outputs
          dart run tool/check_licences.dart

  lighthouse:
    name: lighthouse budgets
    runs-on: ubuntu-24.04
    continue-on-error: true      # advisory until the budgets have a baseline
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE_PATH: /
          VITE_API_BASE: ${{ vars.WORKER_URL }}
      - run: npx @lhci/cli autorun     # thresholds in web/lighthouserc.json (N14)
